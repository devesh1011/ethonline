name: receivablex-p0
x-runtime: &runtime
  image: receivablex-runtime:${RELEASE_ID:-current}
  build:
    context: ../../..
    dockerfile: scripts/deploy/aws/Dockerfile
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: receivablex
      POSTGRES_DB: receivablex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a generated database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U receivablex -d receivablex']
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  api:
    <<: *runtime
    env_file:
      - ${RUNTIME_ENV_FILE:?Set release-specific public runtime env file}
    environment:
      NODE_ENV: production
      RECEIVABLEX_SKIP_DOTENV: 'true'
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://receivablex:${POSTGRES_PASSWORD}@database:5432/receivablex
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:?Set approved browser origins}
      AUTH_ROLE_ALLOWLIST: ${AUTH_ROLE_ALLOWLIST:?Set explicit role allowlist JSON}
    depends_on:
      database: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
  worker:
    <<: *runtime
    command: ['npm', 'run', 'start', '--workspace', '@receivablex/worker']
    env_file:
      - ${RUNTIME_ENV_FILE:?Set release-specific public runtime env file}
      - ${WORKER_ENV_FILE:?Set release-specific worker binding env file}
    volumes:
      - type: bind
        source: ${WORKER_KEYS_DIR:?Set release-specific allowlisted online key directory}
        target: /run/receivablex/keys
        read_only: true
    environment:
      RECEIVABLEX_SKIP_DOTENV: 'true'
      DATABASE_URL: postgresql://receivablex:${POSTGRES_PASSWORD}@database:5432/receivablex
      HEDERA_NETWORK: testnet
    depends_on:
      database: { condition: service_healthy }
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      API_HOSTNAME: ${API_HOSTNAME:?Set public API hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
volumes:
  postgres_data:
    name: receivablex_p0_postgres
  caddy_data:
    name: receivablex_p0_caddy_data
  caddy_config:
    name: receivablex_p0_caddy_config
