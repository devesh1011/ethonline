services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: receivablex
      POSTGRES_USER: receivablex
      POSTGRES_PASSWORD: receivablex
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receivablex -d receivablex"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - receivablex-postgres:/var/lib/postgresql/data

volumes:
  receivablex-postgres:
